[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companysim"
version = "0.1.0"
description = "Digital Workforce Twin — agent-based organizational simulation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "companysim contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "faker>=25.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]
ml = [
    "scikit-learn>=1.5",
    "mlflow>=2.14",
]
viz = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "fpdf2>=2.7",
    "alembic>=1.13",
    "pypdf>=4.0",
]
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "plotly>=5.22",
]
# One extra per provider, so a deployment that has committed to one need
# not carry the other's SDK. Nothing imports either at module scope —
# `llm/provider.py` imports inside the branch that uses it — so installing
# only `bedrock` leaves the Groq path merely unavailable, not broken.
groq = [
    "groq>=1.0",
]
bedrock = [
    # Reached through boto3's `bedrock-runtime` Converse API.
    "boto3>=1.35",
]
# Both. The sensible default for a dev machine: the provider is chosen at
# runtime by COMPANYSIM_LLM_PROVIDER, so having both installed makes
# switching (or rolling back) a config change rather than a reinstall.
llm = [
    "groq>=1.0",
    "boto3>=1.35",
]

[project.scripts]
companysim = "companysim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The deck builder pairs a shape's fill mode with its colour on one line
# (`fill.solid(); fore_color.rgb = X`). Splitting those 33 pairs would
# double the file's length and separate two halves of one setting.
"scripts/build_talk_deck.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
