[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companysim"
version = "0.1.0"
description = "Digital Workforce Twin — agent-based organizational simulation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "companysim contributors" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "faker>=25.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]
ml = [
    "scikit-learn>=1.5",
    "mlflow>=2.14",
]
viz = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "fpdf2>=2.7",
    "alembic>=1.13",
    "pypdf>=4.0",
]
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "plotly>=5.22",
]
llm = [
    "groq>=1.0",
    # Bedrock is reached through boto3's `bedrock-runtime` Converse API.
    # Both SDKs ship together because the provider is chosen at runtime by
    # COMPANYSIM_LLM_PROVIDER, not at install time — a deployment that can
    # only install one of them would fail on a config change rather than
    # on a deploy, which is the worse place to find out.
    "boto3>=1.35",
]

[project.scripts]
companysim = "companysim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
